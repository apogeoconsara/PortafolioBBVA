<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behavioral AI Studio — para BBVA (demo de portafolio)</title>
<meta name="description" content="Demo de portafolio construida para la vacante de Behavioral AI Lead en BBVA: motor de segmentación conductual determinístico + razonamiento de IA opcional. Datos 100% sintéticos, no es un proyecto activo de BBVA.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

/* Design tokens --------------------------------------------------------
   Dark, professional SaaS-dashboard aesthetic. Not a reproduction of any
   real bank's brand system — a generic, banking-adjacent dark palette
   (deep navy ground, cool blue accent, amber/red for risk states) chosen
   to feel at home in an internal analytics console.
------------------------------------------------------------------------- */
:root {
  --bg: #F4F6FA;
  --panel: #FFFFFF;
  --panel-2: #EEF1F7;
  --line: #DCE2ED;
  --line-solid: #DCE2ED;
  --text: #101828;
  --muted: #5B6472;
  --muted-2: #8A93A3;
  --accent: #1447E6;
  --accent-dim: #E4ECFF;
  --accent-text: #1447E6;
  --good: #0F7A56;
  --good-dim: #E3F7EF;
  --warn: #92600A;
  --warn-dim: #FDF1DA;
  --bad: #B42318;
  --bad-dim: #FCE4E2;
  --tier-alta: #B42318;
  --tier-media: #92600A;
  --tier-baja: #5B6472;
  --rail-bg: #1464A5;
  --rail-panel: #1F7DC4;
  --rail-line: #3D8FCE;
  --rail-text: #FFFFFF;
  --rail-muted: #D6EAFB;
  --font-head: 'Inter', sans-serif;
  --font-body: 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-text); text-decoration: none; }
::selection { background: var(--accent-dim); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font-family: inherit; }
input, select, textarea { font-family: inherit; }

.app { display: flex; min-height: 100vh; }

/* --- Rail --- */
.rail {
  width: 252px; flex-shrink: 0;
  background: var(--rail-bg); border-right: 1px solid var(--rail-line);
  padding: 22px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.rail-brand { font-family: var(--font-head); font-weight: 700; font-size: 16px; color: var(--rail-text); display:flex; align-items:center; gap:8px; }
.rail-brand .dot-logo { width: 9px; height: 9px; border-radius: 3px; background: var(--accent); display:inline-block; }
.rail-sub { color: var(--rail-muted); font-size: 11.5px; margin: 4px 0 14px; line-height: 1.4; }
.rail-badge {
  display: inline-flex; align-items: center; gap: 6px; background: var(--rail-panel); color: #FFFFFF;
  font-size: 11px; padding: 4px 8px; border-radius: 4px; margin-bottom: 6px;
}
.rail-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #FFFFFF; }
.rail-badge.synthetic { background: #0E4C7D; color: #FFE7B0; }
.rail-badge.synthetic::before { background: #FFE7B0; }
.rail nav { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; }
.rail nav button {
  all: unset; cursor: pointer; color: var(--rail-muted); font-size: 13.3px; font-weight: 500;
  padding: 9px 10px; border-radius: 6px; display: flex; align-items: center; gap: 9px;
}
.rail nav button:hover { background: var(--rail-panel); color: var(--rail-text); }
.rail nav button.active { background: var(--rail-panel); color: var(--rail-text); box-shadow: inset 3px 0 0 var(--accent); }
.rail nav button .n { width: 18px; height: 18px; border-radius: 5px; background: var(--rail-panel); display:inline-flex; align-items:center; justify-content:center; font-size: 10.5px; font-weight:700; color: var(--rail-muted); flex-shrink:0; }
.rail nav button.active .n { background: var(--accent); color: #fff; }
.rail-foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rail-line); color: var(--rail-muted); font-size: 10.8px; line-height: 1.5; }

/* --- Main --- */
.main { flex: 1; min-width: 0; padding: 28px 36px 70px; max-width: 1240px; }
.page-head { margin-bottom: 22px; }
.page-head h1 { font-family: var(--font-head); font-size: 21px; margin: 0 0 5px; font-weight: 650; }
.page-head p { color: var(--muted); margin: 0; max-width: 760px; font-size: 13px; }

.disclaimer-bar {
  background: var(--warn-dim); border: 1px solid #F0D28A; color: var(--warn);
  border-radius: 8px; padding: 10px 14px; font-size: 12.3px; margin-bottom: 20px; line-height: 1.5;
}
.disclaimer-bar b { color: #6B4A05; }

/* --- KPI grid --- */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
.kpi { background: var(--panel); border: 1px solid var(--line-solid); border-radius: 10px; padding: 15px 16px 13px; }
.kpi .v { font-family: var(--font-head); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
.kpi .v.alta { color: var(--tier-alta); }
.kpi .v.media { color: var(--tier-media); }
.kpi .v.baja { color: var(--tier-baja); }

/* --- Panels / tables --- */
.panel { background: var(--panel); border: 1px solid var(--line-solid); border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-bottom: 1px solid var(--line-solid); gap: 12px; flex-wrap: wrap; }
.panel-head h2 { font-family: var(--font-head); font-size: 13.5px; font-weight: 650; margin: 0; }
.panel-head .hint { color: var(--muted); font-size: 11.8px; }
.panel-body { padding: 16px; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 500; padding: 9px 16px; border-bottom: 1px solid var(--line-solid); text-transform: uppercase; letter-spacing: .03em; }
td { padding: 10px 16px; border-bottom: 1px solid var(--line-solid); font-size: 13px; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--panel-2); }

.pill { display: inline-flex; align-items: center; justify-content: center; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 650; }
.pill.alta { background: var(--bad-dim); color: var(--tier-alta); }
.pill.media { background: var(--warn-dim); color: var(--tier-media); }
.pill.baja { background: var(--panel-2); color: var(--tier-baja); }

.tag { font-size: 11px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line-solid); border-radius: 4px; padding: 2px 7px; display: inline-block; }
.chip { display:inline-flex; align-items:center; gap:5px; background: var(--panel-2); border:1px solid var(--line-solid); border-radius: 20px; padding: 3px 10px; font-size: 11.5px; color: var(--text); }
.chip b { color: var(--accent-text); }

.btn { all: unset; cursor: pointer; background: var(--accent); color: #fff; font-weight: 650; font-size: 12.8px; padding: 8px 14px; border-radius: 7px; display:inline-flex; align-items:center; gap:7px; }
.btn:hover { filter: brightness(1.08); }
.btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line-solid); }
.btn.ai { background: linear-gradient(135deg, #6C5CE7, #4C8DFF); color: #fff; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.small { padding: 6px 11px; font-size: 11.8px; }

.grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 12px; }

.card { background: var(--panel-2); border: 1px solid var(--line-solid); border-radius: 9px; padding: 14px; }
.card h3 { margin: 0 0 6px; font-size: 13.5px; font-family: var(--font-head); font-weight: 650; }
.card p { margin: 0; color: var(--muted); font-size: 12.3px; }

.construct-card { background: var(--panel-2); border: 1px solid var(--line-solid); border-radius: 9px; padding: 14px; display:flex; flex-direction:column; gap:8px; }
.construct-card .cname { font-family: var(--font-head); font-weight: 650; font-size: 13.8px; }
.construct-card .provenance { color: var(--accent-text); font-size: 11px; }
.construct-card .row-label { color: var(--muted); font-size: 10.6px; text-transform: uppercase; letter-spacing: .03em; margin-top: 4px; }
.construct-card .row-value { font-size: 12.4px; }

.evidence-line { display:flex; align-items:flex-start; gap:8px; padding: 8px 0; border-bottom: 1px dashed var(--line-solid); font-size: 12.6px; }
.evidence-line:last-child { border-bottom: none; }
.evidence-line .strength { font-family: var(--font-head); font-weight: 700; min-width: 34px; color: var(--accent-text); }
.evidence-line .body b { color: var(--text); }
.evidence-line .body .ev { color: var(--muted); }

.fact-tag, .inference-tag { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 4px; margin-right: 6px; letter-spacing: .03em; }
.fact-tag { background: var(--good-dim); color: var(--good); }
.inference-tag { background: var(--warn-dim); color: var(--warn); }

.rule-fired { background: var(--accent-dim); border: 1px solid #B9D0FF; border-radius: 8px; padding: 10px 12px; font-size: 12.4px; color: var(--accent-text); margin-bottom: 12px; }
.rule-fired code { background: rgba(16,24,40,.07); padding: 1px 6px; border-radius: 4px; color: var(--text); }

.field-row { display:flex; align-items:center; justify-content:space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-solid); font-size: 12.6px; }
.field-row:last-child { border-bottom: none; }
.field-row .k { color: var(--muted); }
.field-row .v { font-weight: 600; }

.config-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap: 14px; }
.config-item label { display:block; font-size: 11.5px; color: var(--muted); margin-bottom: 5px; }
.config-item input[type=number] { width: 100%; background: var(--panel); border: 1px solid var(--line-solid); color: var(--text); padding: 7px 9px; border-radius: 6px; font-size: 13px; }
.config-item input[type=range] { width: 100%; }

select {
  width: 100%; background: var(--panel); border: 1px solid var(--line-solid); color: var(--text);
  padding: 8px 10px; border-radius: 7px; font-size: 13px;
}

.risk-badge { padding: 2px 9px; border-radius: 20px; font-size: 10.8px; font-weight: 700; }
.risk-badge.bajo { background: var(--good-dim); color: var(--good); }
.risk-badge.medio { background: var(--warn-dim); color: var(--warn); }
.risk-badge.alto { background: var(--bad-dim); color: var(--tier-alta); }

.scatter { position: relative; width: 100%; height: 360px; background: var(--panel-2); border: 1px solid var(--line-solid); border-radius: 9px; overflow: hidden; }
.scatter .axis-label { position:absolute; color: var(--muted); font-size: 11px; }
.scatter .bubble { position:absolute; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); cursor: default; border: 2px solid rgba(255,255,255,.55); }
.scatter .gridline { position:absolute; background: var(--line-solid); }

.hidden { display: none !important; }
.section { display: none; }
.section.active { display: block; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.small-note { color: var(--muted-2); font-size: 11.3px; }

.ai-result { background: var(--panel-2); border: 1px solid var(--line-solid); border-radius: 9px; padding: 14px; margin-top: 12px; }
.ai-result .meta-row { display:flex; gap: 14px; flex-wrap:wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-solid); font-size: 11.3px; color: var(--muted); }
.ai-error { background: var(--bad-dim); border: 1px solid #F3B4AE; color: var(--tier-alta); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; margin-top: 10px; }

.assembled-box { background: var(--panel-2); border: 1px solid var(--line-solid); border-radius: 9px; padding: 16px; margin-top: 14px; white-space: pre-wrap; font-size: 13px; line-height: 1.6; }

.progress-track { background: var(--panel); border-radius: 6px; height: 7px; overflow:hidden; margin-top: 5px; }
.progress-fill { height: 100%; background: var(--accent); }

@media (max-width: 900px) {
  .app { flex-direction: column; }
  .rail { width: 100%; height: auto; position: relative; }
  .main { padding: 20px 16px 50px; }
  .kpi-grid { grid-template-columns: repeat(2,1fr); }
  .grid-2, .two-col { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-brand"><span class="dot-logo"></span>Behavioral AI Studio</div>
    <div class="rail-sub">Demo de portafolio construida para la vacante de <b style="color:var(--rail-text)">Behavioral AI Lead en BBVA</b> — no es un proyecto activo ni oficial de BBVA.</div>
    <div class="rail-badge synthetic">100% datos sintéticos</div>
    <div class="rail-badge">Motor determinístico + IA opcional</div>
    <nav id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
/* =========================================================================
   BEHAVIORAL AI STUDIO — motor determinístico + panel de IA opcional
   Todo el dato de clientes es sintético/ficticio. Ver README para el
   deslinde completo de qué es prototipo real vs. diseño de producción.
   ========================================================================= */

/* ---------------------------------------------------------------------
   1) BIBLIOTECA DE SESGOS / CONSTRUCTOS DE COMPORTAMIENTO (reutilizable)
   ------------------------------------------------------------------- */
const CONSTRUCTS = [
  { id:"loss_aversion", name:"Aversión a la pérdida", provenance:"Kahneman & Tversky — teoría de las perspectivas (1979)",
    definition:"Una pérdida duele psicológicamente más de lo que place una ganancia equivalente del mismo tamaño.",
    proxy:"Frecuencia de sobregiros y retiros de emergencia frente a la velocidad con la que se repone el saldo tras un excedente.",
    nudge:"Enmarcar el costo de no actuar como una pérdida concreta ya incurrida (ej. \"perdiste $X en comisiones\") en vez de una ganancia potencial futura." },
  { id:"present_bias", name:"Sesgo del presente / descuento hiperbólico", provenance:"Laibson (1997); Thaler (1981)",
    definition:"Preferencia desproporcionada por una recompensa inmediata pequeña sobre un beneficio mayor pero futuro.",
    proxy:"Meses consecutivos pagando solo el pago mínimo de una tarjeta de crédito pese a tener capacidad de pagar más.",
    nudge:"Compromiso diferido: programar hoy un incremento automático del pago que se activa en 60 días, con opción de cancelarlo antes." },
  { id:"default_effect", name:"Efecto del default (opción preseleccionada)", provenance:"Johnson & Goldstein (2003); Thaler & Sunstein, \"Nudge\" (2008)",
    definition:"La opción preconfigurada se elige con mucha mayor frecuencia que si el usuario tuviera que activarla manualmente.",
    proxy:"Tasa de enrolamiento en ahorro automático o redondeo cuando la activación es opt-in vs. cuando viene activada por defecto (opt-out).",
    nudge:"Cambiar el ahorro automático de opt-in a opt-out con un monto inicial pequeño y una salida de un clic siempre visible." },
  { id:"social_proof", name:"Prueba social", provenance:"Cialdini, \"Influence\" (1984)",
    definition:"Las personas imitan el comportamiento que observan en otras personas, especialmente en pares similares a ellas.",
    proxy:"Tasa de activación de una función financiera tras mostrar el porcentaje de clientes similares que ya la usan.",
    nudge:"Comparativas normativas honestas (\"7 de cada 10 clientes de tu rango de edad ya activaron el ahorro automático\"), nunca cifras infladas." },
  { id:"anchoring", name:"Anclaje", provenance:"Tversky & Kahneman (1974)",
    definition:"Un juicio numérico queda sesgado hacia el primer valor presentado, aunque ese valor sea arbitrario.",
    proxy:"Relación entre el \"pago sugerido\" mostrado primero en el estado de cuenta y el monto que el cliente termina pagando.",
    nudge:"Mostrar un pago sugerido saludable (p. ej. 3 veces el mínimo legal) como ancla visual antes del monto de pago mínimo." },
  { id:"mental_accounting", name:"Contabilidad mental", provenance:"Thaler (1985, 1999)",
    definition:"El dinero se trata de forma distinta según la \"cuenta mental\" a la que la persona lo asigna, en vez de tratarlo como fungible.",
    proxy:"Retiros de una cuenta de ahorro etiquetada (p. ej. \"vacaciones\") para cubrir gasto corriente no relacionado.",
    nudge:"Reforzar visualmente la etiqueta y el propósito de la meta en cada resumen de cuenta, para fortalecer la barrera mental frente al retiro." },
  { id:"commitment_devices", name:"Dispositivos de compromiso", provenance:"Thaler & Shefrin (1981); Ariely & Wertenbroch (2002)",
    definition:"Acuerdos que una persona hace consigo misma para atarse a una meta futura, limitando su propia flexibilidad de forma voluntaria.",
    proxy:"Adopción de metas de ahorro con una restricción de retiro anticipado o penalización auto-impuesta y voluntaria.",
    nudge:"Ofrecer un \"candado de meta\" opcional (bloqueo parcial y temporal, reversible) al momento de crear una meta de ahorro." },
  { id:"salience_bias", name:"Sesgo de saliencia", provenance:"Bordalo, Gennaioli & Shleifer — teoría de la saliencia (2012)",
    definition:"La atención se dirige de forma desproporcionada a la información más llamativa o visible, no a la más relevante.",
    proxy:"Crecimiento neto de cargos recurrentes/suscripciones pequeñas que pasan desapercibidas frente a un solo cargo grande y visible.",
    nudge:"Mostrar un resumen mensual agregado del total de cargos recurrentes, en vez de cada cargo pequeño por separado y disperso." },
  { id:"endowment_effect", name:"Efecto de dotación", provenance:"Kahneman, Knetsch & Thaler (1990)",
    definition:"Un bien se valora más por el simple hecho de poseerlo, comparado con adquirir ese mismo bien desde cero.",
    proxy:"Resistencia a migrar a un producto objetivamente mejor una vez que el cliente ya tiene contratado el producto actual.",
    nudge:"Enmarcar el cambio de producto como \"actualizar lo que ya tienes\" en vez de \"cambiar a algo nuevo\"." },
  { id:"status_quo_bias", name:"Sesgo de statu quo", provenance:"Samuelson & Zeckhauser (1988)",
    definition:"Preferencia por mantener la situación actual incluso cuando existen alternativas mejores y de bajo costo de cambio.",
    proxy:"Días sin ningún movimiento (depósito, retiro o edición) en una meta de ahorro que el cliente sí creó activamente.",
    nudge:"Recordatorio de reactivación con una sola acción de un clic para reanudar la aportación mensual con el monto anterior." },
  { id:"framing_effect", name:"Efecto de encuadre (framing)", provenance:"Tversky & Kahneman (1981)",
    definition:"La misma información, presentada como ganancia o como pérdida, cambia sistemáticamente la decisión tomada.",
    proxy:"Diferencia de tasa de respuesta entre un mensaje en términos de ganancia (\"ahorra $X\") y uno en términos de pérdida (\"dejas de ganar $X\").",
    nudge:"Usar encuadre de pérdida solo para audiencias con aversión a la pérdida ya detectada; encuadre de ganancia para el resto." },
  { id:"peak_end_rule", name:"Regla pico-final", provenance:"Kahneman et al. (Fredrickson & Kahneman, 1993)",
    definition:"Una experiencia se evalúa sobre todo por su punto más intenso y por cómo termina, no por su promedio.",
    proxy:"Si el cierre de un proceso (p. ej. completar una meta de ahorro) se comunica con un momento destacado o pasa como un aviso transaccional más.",
    nudge:"Diseñar un momento de cierre explícito y celebratorio al alcanzar una meta, distinto de una notificación transaccional genérica." },
  { id:"goal_gradient_effect", name:"Efecto de gradiente de meta", provenance:"Hull (1932); Kivetz, Urminsky & Zheng (2006)",
    definition:"El esfuerzo y la motivación aumentan a medida que la persona percibe que se acerca más a completar una meta.",
    proxy:"Aceleración de los depósitos hacia una meta de ahorro conforme el porcentaje de avance sube, especialmente después del 60-70%.",
    nudge:"Mostrar una barra de progreso con el monto exacto que falta cerca del final (\"ya vas al 85%, faltan $X\") para capitalizar el impulso." },
  { id:"choice_overload", name:"Sobrecarga de opciones", provenance:"Iyengar & Lepper (2000)",
    definition:"Demasiadas opciones simultáneas reducen la probabilidad de decidir y la satisfacción con la decisión tomada.",
    proxy:"Tasa de abandono en pantallas que muestran más de 5-6 opciones de producto o plan al mismo tiempo.",
    nudge:"Reducir el menú visible a 3 opciones curadas por defecto (\"recomendado para ti\"), con un enlace opcional a \"ver todas\"." },
  { id:"affect_heuristic", name:"Heurística del afecto", provenance:"Slovic, Finucane, Peters & MacGregor (2002)",
    definition:"Las decisiones se basan en la reacción emocional inmediata (\"me gusta / no me gusta\") más que en un análisis costo-beneficio explícito.",
    proxy:"Aumento de gasto concentrado en los días inmediatamente posteriores a la fecha de pago de nómina, comparado con el promedio diario del mes.",
    nudge:"Evitar mensajes con carga emocional negativa (miedo, urgencia artificial) al recomendar productos; usar tono neutro e informativo con datos verificables." }
];
const CONSTRUCT_BY_ID = Object.fromEntries(CONSTRUCTS.map(c => [c.id, c]));

/* ---------------------------------------------------------------------
   2) DATASET SINTÉTICO DE CLIENTES (100% ficticio — ver README)
   ------------------------------------------------------------------- */
const CUSTOMERS = [
  { id:"cs_01", first_name:"Ana", last_name:"Martínez López", age:34, tenure_months:26, income_band:"Medio",
    metrics:{ min_payment_streak_months:5, credit_utilization_pct:82, overdraft_events_90d:0, late_payment_events_90d:1,
      savings_goal_dormant_days:null, autosave_enrolled:true, roundup_enabled:true, goal_progress_pct:null,
      new_subscriptions_90d:2, cancelled_subscriptions_90d:0, withdrawal_from_goal_90d:0, payday_spike_ratio:1.5 } },
  { id:"cs_02", first_name:"Jorge", last_name:"Hernández Ruiz", age:29, tenure_months:14, income_band:"Bajo",
    metrics:{ min_payment_streak_months:1, credit_utilization_pct:40, overdraft_events_90d:3, late_payment_events_90d:2,

/* ---------------------------------------------------------------------
   3) CONFIGURACIÓN EDITABLE EN VIVO (pesos / umbrales del motor)
   ------------------------------------------------------------------- */
const CONFIG = {
  signal_strength_min: 20,
  rule_min_payment_streak: 4,
  rule_credit_utilization: 70,
  rule_overdraft_events: 2,
  rule_dormant_days: 90,
  rule_subscription_net: 2,
  rule_goal_progress_min: 70,
  init_w_impact: 0.40,
  init_w_alignment: 0.35,
  init_w_complexity: 0.25
};

/* ---------------------------------------------------------------------
   4) MOTOR DE SEÑALES — puramente determinístico, fórmulas documentadas
   ------------------------------------------------------------------- */
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

function computeSignals(m) {
  const out = [];
  const presentBias = clamp(m.min_payment_streak_months*15 + Math.max(0, m.credit_utilization_pct-50), 0, 100);
  if (presentBias >= CONFIG.signal_strength_min) out.push({ construct:"present_bias", strength: Math.round(presentBias),
    evidence: `${m.min_payment_streak_months} meses seguidos con solo pago mínimo, utilización de crédito ${m.credit_utilization_pct}%.`,
    formula: "min(100, meses_pago_minimo×15 + max(0, utilizacion% − 50))" });

  const lossAversion = clamp(m.overdraft_events_90d*30 + m.late_payment_events_90d*12, 0, 100);
  if (lossAversion >= CONFIG.signal_strength_min) out.push({ construct:"loss_aversion", strength: Math.round(lossAversion),
    evidence: `${m.overdraft_events_90d} sobregiros y ${m.late_payment_events_90d} pagos tardíos en los últimos 90 días.`,
    formula: "min(100, sobregiros_90d×30 + pagos_tardios_90d×12)" });

  const statusQuo = m.savings_goal_dormant_days ? clamp(m.savings_goal_dormant_days/2.5, 0, 100) : 0;
  if (statusQuo >= CONFIG.signal_strength_min) out.push({ construct:"status_quo_bias", strength: Math.round(statusQuo),
    evidence: `Meta de ahorro sin ningún movimiento desde hace ${m.savings_goal_dormant_days} días.`,
    formula: "min(100, dias_meta_dormida / 2.5)" });

  const net = m.new_subscriptions_90d - m.cancelled_subscriptions_90d;
  const salience = clamp(Math.max(0, net)*28, 0, 100);
  if (salience >= CONFIG.signal_strength_min) out.push({ construct:"salience_bias", strength: Math.round(salience),
    evidence: `${m.new_subscriptions_90d} cargos recurrentes nuevos vs. ${m.cancelled_subscriptions_90d} cancelados en 90 días.`,
    formula: "min(100, max(0, suscripciones_nuevas_90d − suscripciones_canceladas_90d)×28)" });

  let goalGradient = 0;
  if (m.goal_progress_pct != null) goalGradient = m.goal_progress_pct >= 60 ? m.goal_progress_pct : m.goal_progress_pct*0.3;
  if (goalGradient >= CONFIG.signal_strength_min) out.push({ construct:"goal_gradient_effect", strength: Math.round(goalGradient),
    evidence: `Meta de ahorro activa al ${m.goal_progress_pct}% de avance.`,
    formula: "avance% si avance% ≥ 60, si no avance%×0.3" });

  const noGoalAtAll = (m.goal_progress_pct == null && m.savings_goal_dormant_days == null);
  const defaultEff = (m.autosave_enrolled ? 0 : 40) + (m.roundup_enabled ? 0 : 30) + (noGoalAtAll ? 20 : 0);
  if (defaultEff >= CONFIG.signal_strength_min) out.push({ construct:"default_effect", strength: Math.round(clamp(defaultEff,0,100)),
    evidence: `Ahorro automático ${m.autosave_enrolled ? "activo" : "inactivo"}, redondeo ${m.roundup_enabled ? "activo" : "inactivo"}${noGoalAtAll ? ", sin ninguna meta creada" : ""}.`,
    formula: "(¬autosave)×40 + (¬redondeo)×30 + (sin_meta_alguna)×20" });

  const mentalAcc = clamp((m.withdrawal_from_goal_90d||0)*35, 0, 100);
  if (mentalAcc >= CONFIG.signal_strength_min) out.push({ construct:"mental_accounting", strength: Math.round(mentalAcc),
    evidence: `${m.withdrawal_from_goal_90d} retiro(s) de una meta de ahorro etiquetada en los últimos 90 días.`,
    formula: "min(100, retiros_de_meta_90d×35)" });

  const affect = m.payday_spike_ratio > 1.4 ? clamp((m.payday_spike_ratio-1)*55, 0, 100) : 0;
  if (affect >= CONFIG.signal_strength_min) out.push({ construct:"affect_heuristic", strength: Math.round(affect),
    evidence: `Gasto en días posteriores a nómina es ${m.payday_spike_ratio.toFixed(2)}× el promedio diario del mes.`,
    formula: "si payday_ratio > 1.4: min(100, (payday_ratio − 1)×55), si no 0" });

  out.sort((a,b) => b.strength - a.strength);
  return out.slice(0, 5);
}

const RULES = [
  { id:"R1", segment:"Deuda revolvente crónica", priority:"Alta", nudge:"compromiso_pago_futuro",
    describe: () => `min_payment_streak_months ≥ ${CONFIG.rule_min_payment_streak} Y credit_utilization_pct ≥ ${CONFIG.rule_credit_utilization}`,
    test: (m) => m.min_payment_streak_months >= CONFIG.rule_min_payment_streak && m.credit_utilization_pct >= CONFIG.rule_credit_utilization },
  { id:"R2", segment:"Riesgo de sobregiro recurrente", priority:"Alta", nudge:"colchon_automatico_default",
    describe: () => `overdraft_events_90d ≥ ${CONFIG.rule_overdraft_events}`,
    test: (m) => m.overdraft_events_90d >= CONFIG.rule_overdraft_events },
  { id:"R3", segment:"Meta de ahorro abandonada", priority:"Media", nudge:"reactivacion_un_clic",
    describe: () => `savings_goal_dormant_days ≥ ${CONFIG.rule_dormant_days} Y autosave_enrolled = false`,
    test: (m) => m.savings_goal_dormant_days >= CONFIG.rule_dormant_days && m.autosave_enrolled === false },
  { id:"R4", segment:"Gasto en suscripciones creciente", priority:"Media", nudge:"resumen_cargos_recurrentes",
    describe: () => `(new_subscriptions_90d − cancelled_subscriptions_90d) ≥ ${CONFIG.rule_subscription_net}`,
    test: (m) => (m.new_subscriptions_90d - m.cancelled_subscriptions_90d) >= CONFIG.rule_subscription_net },
  { id:"R5", segment:"Cerca de la meta (impulso final)", priority:"Media", nudge:"impulso_tramo_final",
    describe: () => `goal_progress_pct entre ${CONFIG.rule_goal_progress_min} y 99`,
    test: (m) => m.goal_progress_pct != null && m.goal_progress_pct >= CONFIG.rule_goal_progress_min && m.goal_progress_pct < 100 },
  { id:"R6", segment:"Sin hábito de ahorro automático", priority:"Baja", nudge:"activar_ahorro_opt_out",
    describe: () => `autosave_enrolled = false Y roundup_enabled = false Y sin ninguna meta creada`,
    test: (m) => m.autosave_enrolled === false && m.roundup_enabled === false && m.savings_goal_dormant_days == null && m.goal_progress_pct == null },
  { id:"R7", segment:"Comportamiento financiero estable", priority:"Baja", nudge:"mantenimiento_positivo",
    describe: () => `Ninguna de las reglas anteriores aplica (fallback)`,
    test: () => true }
];

function segmentCustomer(customer) {
  const m = customer.metrics;
  for (const rule of RULES) {
    if (rule.test(m)) {
      return { rule_id: rule.id, rule_desc: rule.describe(), segment: rule.segment, priority: rule.priority, nudge_id: rule.nudge };
    }
  }
  return { rule_id: "R7", rule_desc: "fallback", segment: "Comportamiento financiero estable", priority: "Baja", nudge_id: "mantenimiento_positivo" };
}

  { id:"aumentar_ahorro", label:"Aumentar ahorro automático", opener:"Queremos ayudarte a que ahorrar te cueste menos esfuerzo." },

];
const SELF_SERVICE_SEGMENTS = RULES.map(r => ({ id: r.id, label: r.segment }));

function assembleSelfServiceNudge(goalId, segmentId, constructId) {
  const goal = SELF_SERVICE_GOALS.find(g => g.id === goalId);
  const seg = SELF_SERVICE_SEGMENTS.find(s => s.id === segmentId);
  const construct = CONSTRUCT_BY_ID[constructId];
  if (!goal || !seg || !construct) return null;
  return {
    title: `${goal.label} — segmento "${seg.label}"`,
    body: `${goal.opener}\n\nConstructo de comportamiento aplicado: ${construct.name} (${construct.provenance}).\n\nPatrón de nudge sugerido: ${construct.nudge}\n\nProxy medible recomendado para validar impacto: ${construct.proxy}`,
    note: "Plantilla generada por ensamblado determinístico de texto (sin llamada a IA). Revisar y ajustar el tono antes de usar con un cliente real."
  };
}

async function runLiveAiReasoning(customerId) {
  const customer = CUSTOMERS.find(c => c.id === customerId);
  const seg = segmentCustomer(customer);
  const signals = computeSignals(customer.metrics);
  aiLoadingByCustomer[customerId] = true;
  renderCustomerDetail();
  try {
    const res = await fetch("/.netlify/functions/behavioral-reasoning", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        customer: { id: customer.id, first_name: customer.first_name },
        segment: seg.segment,
        priority_tier: seg.priority,
        fired_rule: seg.rule_id + ": " + seg.rule_desc,
        signals: signals.map(s => ({ construct: CONSTRUCT_BY_ID[s.construct].name, strength: s.strength, evidence: s.evidence })),
        raw_metrics: customer.metrics
      })
    });
    const data = await res.json();
    if (!res.ok) {
      aiResultByCustomer[customerId] = { error: data.error || `Error ${res.status} al llamar a la función.` };
    } else {
      aiResultByCustomer[customerId] = data;
    }
  } catch (e) {
    aiResultByCustomer[customerId] = { error: "No se pudo contactar la función de IA en vivo (¿estás corriendo esto localmente sin `netlify dev`, o el sitio no tiene ANTHROPIC_API_KEY configurada?). El nudge determinístico de arriba sigue siendo válido." };
  }
  aiLoadingByCustomer[customerId] = false;
  renderCustomerDetail();
}

function scoreInitiative(init) {
  return CONFIG.init_w_impact*init.impact + CONFIG.init_w_alignment*init.alignment - CONFIG.init_w_complexity*init.complexity;
}

  tbody.innerHTML = ranked.map((i, idx) => `
    <tr><td>${idx+1}</td><td><b>${i.title}</b><br><span class="small-note">${i.description}</span></td><td>${i.impact}</td><td>${i.complexity}</td><td>${i.alignment}</td><td><b>${i.score.toFixed(2)}</b></td></tr>

  el.innerHTML = "";
  const colors = ["#4C8DFF","#34D399","#F5B54C","#F0637A","#9CC0FF","#6C5CE7","#2ED8C3","#E08FE0","#FFB37A"];
  INITIATIVES.forEach((init, idx) => {
    const x = 8 + ((init.complexity-1)/4) * 82;
    const y = 88 - ((init.impact-1)/4) * 78;
    const size = 26 + init.alignment*7;
    const b = document.createElement("div");
    b.className = "bubble";
    b.style.left = `calc(${x}% - ${size/2}px)`;
    b.style.top = `calc(${y}% - ${size/2}px)`;
    b.style.width = size+"px";
    b.style.height = size+"px";
    b.style.background = colors[idx % colors.length];
    b.title = init.title;
    b.textContent = idx+1;
    el.appendChild(b);
  });
}

function updateWeight(key, value) {
  CONFIG[key] = parseFloat(value);
  if (activeSection === "portafolio") renderPortafolio(document.getElementById("main"));
}

/* ---- Autoservicio ---- */
function renderAutoservicio(main) {
  main.innerHTML = `
    <div class="page-head">
      <h1>Autoservicio — construye un nudge sin necesitar a un experto</h1>
      <p>Una persona de negocio sin conocimientos de ciencia de datos elige un objetivo, un segmento y un constructo de comportamiento, y la herramienta ensambla un borrador de nudge a partir de plantillas. Sin llamada a IA: es ensamblado determinístico de texto, para que esto escale sin depender de un especialista como cuello de botella.</p>
    </div>
    <div class="panel">
      <div class="panel-body">
        <div class="two-col">
          <div class="config-item"><label>1. Objetivo de negocio</label>
            <select id="ss-goal">${SELF_SERVICE_GOALS.map(g => `<option value="${g.id}">${g.label}</option>`).join("")}</select>
          </div>
          <div class="config-item"><label>2. Segmento de cliente</label>
            <select id="ss-segment">${SELF_SERVICE_SEGMENTS.map(s => `<option value="${s.id}">${s.label}</option>`).join("")}</select>
          </div>
        </div>
        <div class="config-item" style="margin-top:12px;"><label>3. Constructo de comportamiento a aplicar</label>
          <select id="ss-construct">${CONSTRUCTS.map(c => `<option value="${c.id}">${c.name}</option>`).join("")}</select>
        </div>
        <button class="btn" style="margin-top:14px;" onclick="buildSelfServiceNudge()">Ensamblar borrador de nudge</button>
        <div id="ss-result"></div>
      </div>
    </div>
  `;
}

function buildSelfServiceNudge() {
  const goalId = document.getElementById("ss-goal").value;
  const segmentId = document.getElementById("ss-segment").value;
  const constructId = document.getElementById("ss-construct").value;
  const result = assembleSelfServiceNudge(goalId, segmentId, constructId);
  document.getElementById("ss-result").innerHTML = result ? `
    <div class="assembled-box"><b>${result.title}</b>\n\n${result.body}</div>
    <div class="small-note" style="margin-top:8px;">${result.note}</div>
  ` : "";
}

/* ---- Configuración ---- */
function renderConfig(main) {
  main.innerHTML = `
    <div class="page-head">
      <h1>Configuración del motor</h1>
      <p>Los umbrales y pesos del motor de segmentación son editables en vivo — esto demuestra que el sistema es configurable, no una lógica de scoring escondida y fija en el código.</p>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Umbral mínimo de señal</h2></div>
      <div class="panel-body config-grid">
        <div class="config-item"><label>Fuerza mínima para mostrar una señal (0-100)</label><input type="number" min="0" max="100" value="${CONFIG.signal_strength_min}" onchange="updateConfigNum('signal_strength_min', this.value)"></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Umbrales de las reglas de segmentación</h2></div>
      <div class="panel-body config-grid">
        <div class="config-item"><label>R1 — meses de pago mínimo</label><input type="number" value="${CONFIG.rule_min_payment_streak}" onchange="updateConfigNum('rule_min_payment_streak', this.value)"></div>
        <div class="config-item"><label>R1 — utilización de crédito (%)</label><input type="number" value="${CONFIG.rule_credit_utilization}" onchange="updateConfigNum('rule_credit_utilization', this.value)"></div>
        <div class="config-item"><label>R2 — sobregiros mínimos (90d)</label><input type="number" value="${CONFIG.rule_overdraft_events}" onchange="updateConfigNum('rule_overdraft_events', this.value)"></div>
        <div class="config-item"><label>R3 — días de meta dormida</label><input type="number" value="${CONFIG.rule_dormant_days}" onchange="updateConfigNum('rule_dormant_days', this.value)"></div>
        <div class="config-item"><label>R4 — neto de suscripciones nuevas</label><input type="number" value="${CONFIG.rule_subscription_net}" onchange="updateConfigNum('rule_subscription_net', this.value)"></div>
        <div class="config-item"><label>R5 — % mínimo de avance de meta</label><input type="number" value="${CONFIG.rule_goal_progress_min}" onchange="updateConfigNum('rule_goal_progress_min', this.value)"></div>
      </div>
      <div class="panel-body" style="padding-top:0;">
        <button class="btn secondary" onclick="renderConfigImpact()">Ver impacto en la distribución de clientes</button>
        <div id="config-impact"></div>
      </div>
    </div>
  `;
  renderConfigImpact();
}

function updateConfigNum(key, value) {
  CONFIG[key] = parseFloat(value);
  renderConfigImpact();
}

function renderConfigImpact() {
  const el = document.getElementById("config-impact");
  if (!el) return;
  const counts = {};
  RULES.forEach(r => counts[r.id] = 0);
  CUSTOMERS.forEach(c => { const s = segmentCustomer(c); counts[s.rule_id]++; });
  el.innerHTML = `<table style="margin-top:12px;"><thead><tr><th>Regla</th><th>Segmento</th><th>Prioridad</th><th>Clientes que caen aquí ahora</th></tr></thead><tbody>
    ${RULES.map(r => `<tr><td><span class="tag">${r.id}</span></td><td>${r.segment}</td><td><span class="pill ${r.priority.toLowerCase()}">${r.priority}</span></td><td><b>${counts[r.id]}</b></td></tr>`).join("")}
  </tbody></table>`;
}

renderNav();
renderMain();
